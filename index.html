  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);

      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      direction: rtl;
    }

    h1 {
      color: #00796b;
      font-size: 2em;
      margin-bottom: 15px;
    }

    p {
      max-width: 400px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .link-image {
      display: inline-block;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .link-image img {
      display: block;
      max-width: 250px;
      width: 100%;
      height: auto;
    }

    .link-image:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    footer {
      margin-top: 50px;
      font-size: 13px;
      color: #777;
      text-align: center;
      line-height: 1.4;
    }

    footer a {
      color: #00796b;
      text-decoration: none;
    }
  </style>
</head>
